name: Publish haul sheet
on:
  push:
    paths:
      - 'chunks/**'
      - '.github/workflows/publish-haul-sheet.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html
        run: |
          set -euo pipefail
          : > /tmp/assembled.html
          for f in $(ls chunks/*.b64 | sort); do
            tr -d '\n\r \t' < "$f" | base64 -d >> /tmp/assembled.html
          done
          echo "assembled bytes=$(wc -c < /tmp/assembled.html)"
          test "$(wc -c < /tmp/assembled.html)" -eq 171334
          mv /tmp/assembled.html index.html
          : > .nojekyll
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Publish Haul Sheet index.html [skip ci]"
            git push
          fi
      - name: Enable Pages from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BODY='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/pages" --input - <<<"$BODY"
          gh api --method PUT -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/pages" --input - <<<"$BODY"
          gh api "/repos/${{ github.repository }}/pages" || true
